
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Apex Motors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border: 1px solid #263449;
            border-radius: 14px;
            background: #131c2e;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aab7ca;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #35445c;
            border-radius: 6px;
            background: #0b1120;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #d4a843;
            color: #111827;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            color: #ff9999;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #d4a843;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="login-box">
        <h1>Apex Motors</h1>
        <p class="subtitle">Administrator Login</p>

        <form id="login-form">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="login-button">
                Sign In
            </button>

            <p id="message" role="status"></p>
        </form>

        <a href="index.html" class="back-link">
            Back to website
        </a>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("message");
        const button = document.getElementById("login-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Signing in...";

            try {
                const response = await fetch(
                    "http://localhost:3000/api/admin/login",
                    {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: document
                                .getElementById("username").value,
                            password: document
                                .getElementById("password").value
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.error || "Login failed."
                    );
                }

                window.location.href = "admin.html";
            } catch (error) {
                message.textContent =
                    error.message === "Failed to fetch"
                        ? "Cannot connect to the server. Check that it is running."
                        : error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
